<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Sin conexion | Control Porcino</title>
    <style>
      body {
        align-items: center;
        background: #f7faf8;
        color: #18352b;
        display: flex;
        font-family: system-ui, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      main {
        max-width: 420px;
      }
      h1 {
        font-size: 1.6rem;
        margin-bottom: 12px;
      }
      p {
        color: #496158;
        line-height: 1.6;
      }
      button {
        background: #16734a;
        border: 0;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        margin-top: 12px;
        padding: 12px 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No hay conexion</h1>
      <p>Vuelve a conectarte a internet e intenta cargar Control Porcino de nuevo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
